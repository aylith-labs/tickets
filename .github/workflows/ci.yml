name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Publish and release run on triggers this workflow never sees, so they call
  # this gate as their own `verify` job rather than redefining the steps.
  workflow_call:

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun test
      - run: bunx tsc --noEmit
      - run: bunx biome check .
      - run: bun run build

      # binary.ts is excluded from tsc (Bun-only `with { type: 'file' }` imports),
      # so compiling it is the only check it gets. build:bin chains build:web, so
      # this covers the embedded web bundle too.
      - run: bun run build:bin
