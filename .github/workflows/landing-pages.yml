name: Tickets homepage
on:
  push:
    branches: [main]
    paths: ['landing/**', 'packages/core/src/prompt.ts', 'packages/core/src/types/**', '.github/workflows/landing-pages.yml']
  pull_request:
    paths: ['landing/**', 'packages/core/src/prompt.ts', 'packages/core/src/types/**', '.github/workflows/landing-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tickets-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ vars.CI_RUNNER == '' || vars.CI_RUNNER == 'ubuntu-latest' }}
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    # This is a public repository: never route it to an org self-hosted runner.
    if: ${{ vars.CI_RUNNER == '' || vars.CI_RUNNER == 'ubuntu-latest' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build source-owned homepage with the repository's verified Bun toolchain
        run: |
          bun --version
          bun landing/build.ts
          python3 landing/verify.py
          node landing/verify-controls.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: landing/build
  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (vars.CI_RUNNER == '' || vars.CI_RUNNER == 'ubuntu-latest') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
