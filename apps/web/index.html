<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tickets</title>
<!-- Optional deployment-owned destinations. Empty values keep native navigation. -->
<meta name="aylith-shell-manifest" content="">
<meta name="aylith-shell-enabled" content="false">
<meta name="aylith-dashcam-url" content="">
<style>
	:root {
		color-scheme: light dark;
	}

	:root[data-theme='light'] {
		color-scheme: light;
	}

	:root[data-theme='dark'] {
		color-scheme: dark;
	}

	body {
		margin: 0;
		min-height: 100dvh;
		background: light-dark(#f8f7f4, #131110);
		color: light-dark(#1c1a16, #f3efe8);
		font: 15px/1.5 system-ui, sans-serif;
	}

	.shell {
		max-width: 52rem;
		margin: 0 auto;
		padding: 1.5rem 1rem 4rem;
	}

	/* Docked split active: give the panes the whole viewport. */
	.shell.wide {
		max-width: none;
	}

	.shell > header {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: 1rem;
		margin-bottom: 1.25rem;
	}

	h1 {
		font-size: 1.1rem;
		margin: 0;
		letter-spacing: -0.01em;
	}

	h1 a {
		color: inherit;
		text-decoration: none;
	}

	#projects {
		display: flex;
		flex-wrap: wrap;
		gap: 0.35rem;
		flex: 1;
	}

	.chip {
		font-size: 0.75rem;
		padding: 0.2rem 0.65rem;
		border-radius: 999px;
		border: 1px solid light-dark(#e1ddd3, #332f29);
		color: light-dark(#615b50, #b0a08a);
		text-decoration: none;
	}

	.chip.active {
		background: var(--ay-accent, light-dark(oklch(0.56 0.13 50), #e0a86b));
		border-color: transparent;
		color: light-dark(#fff, #17140f);
	}

	#theme-toggle {
		font: inherit;
		font-size: 0.75rem;
		padding: 0.25rem 0.65rem;
		border-radius: 999px;
		border: 1px solid light-dark(#e1ddd3, #332f29);
		background: none;
		color: light-dark(#615b50, #b0a08a);
		cursor: pointer;
	}

	.chip .scope {
		margin-left: 0.3rem;
		opacity: 0.65;
	}

	#project-info {
		margin: -0.5rem 0 1.25rem;
		font-size: 0.72rem;
		line-height: 1.4;
		color: light-dark(#8a8073, #7d7266);
		font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
		overflow-wrap: anywhere;
	}

	#project-info .warn {
		color: light-dark(#c0392b, #ff9d9d);
	}
	body[data-shell-ready='true'] {
		padding-top: var(--aylith-shell-header-height, 58px);
		padding-left: var(--aylith-shell-sidebar-width, 272px);
	}
	body[data-shell-ready='true']:has(.aylith-shell[data-sidebar-position='right']) {
		padding-left: 0;
		padding-right: var(--aylith-shell-sidebar-width, 272px);
	}
	@media (max-width: 760px) {
		body[data-shell-ready='true'], body[data-shell-ready='true']:has(.aylith-shell[data-sidebar-position='right']) {
			padding-left: 0;
			padding-right: 0;
		}
	}
	#shell-controls {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: .75rem;
		font-size: .75rem;
		margin-bottom: 1rem;
	}
	#shell-controls[hidden] { display: none; }
	#shell-toggle {
		font: inherit;
		padding: .25rem .65rem;
		border: 1px solid light-dark(#e1ddd3, #332f29);
		border-radius: 999px;
		background: none;
		color: inherit;
		cursor: pointer;
	}
	#shell-toggle:disabled { opacity: .6; cursor: wait; }
</style>
<div class="shell">
	<header>
		<h1><a href="/">tickets</a></h1>
		<nav id="projects" aria-label="Projects"></nav>
		<button type="button" id="theme-toggle" aria-label="Theme"></button>
	</header>
	<div id="shell-controls" hidden>
		<span id="shell-status" role="status"></span>
		<button id="shell-toggle" type="button">Retry shared navigation</button>
	</div>
	<p id="project-info" aria-live="polite"></p>
	<main id="app"></main>
</div>
<script type="module" src="./main.js"></script>
